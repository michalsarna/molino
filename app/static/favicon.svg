<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#111214"/>
  <!-- Gantry top bar -->
  <rect x="3" y="5" width="26" height="3.5" rx="1.5" fill="#e8a04a"/>
  <!-- Left column -->
  <rect x="3" y="5" width="3" height="19" rx="1" fill="#c0842e"/>
  <!-- Right column -->
  <rect x="26" y="5" width="3" height="19" rx="1" fill="#c0842e"/>
  <!-- Spindle body -->
  <rect x="13" y="8.5" width="6" height="9" rx="1.5" fill="#e8a04a"/>
  <!-- V-bit tip -->
  <polygon points="13,17.5 19,17.5 16,26" fill="#e8a04a"/>
  <!-- Spindle highlight -->
  <rect x="14.5" y="10" width="1.5" height="6" rx="0.75" fill="#fff" opacity="0.28"/>
  <!-- Work surface -->
  <line x1="3" y1="27" x2="29" y2="27" stroke="#4a4a4a" stroke-width="1.5" stroke-linecap="round"/>
</svg>
